<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Günlük kaydı · Sosyal Oyun</title>
  <link rel="stylesheet" href="stil.css">
</head>
<body>
<main>
  <header><a href="./">Sosyal Oyun</a></header>
  <section id="icerik" class="kart"><p class="soluk">Yükleniyor…</p></section>
  <footer><p>Oyun verisi <a href="https://www.igdb.com" rel="noopener">IGDB.com</a>'dan alınmıştır.</p></footer>
</main>
<script src="ayarlar.js"></script>
<script src="ortak.js"></script>
<script>
  (async () => {
    const kutu = document.getElementById("icerik");
    const id = new URLSearchParams(location.search).get("id");
    try {
      // Yalnızca Herkes görünürlüğündeki kayıtlar döner; diğerleri bulunamadı sayılır.
      const detay = id ? await apiGetir("/paylasim/gunluk/" + encodeURIComponent(id)) : null;
      if (!detay) return bulunamadi(kutu, "Bu günlük kaydı bulunamadı ya da herkese açık değil.");
      document.title = detay.oyun.ad + " · " + detay.sahip.gorunenAd + " · Sosyal Oyun";
      kutu.replaceChildren(kisiKarti(detay.sahip), oyunVeKayit(detay.oyun, detay.kayit), magazaDugmeleri());
    } catch (e) {
      kutu.replaceChildren(oge("p", { metin: "Şu an yüklenemedi. Biraz sonra tekrar dene." }));
    }
  })();
</script>
</body>
</html>
