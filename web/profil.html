<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Profil · Sosyal Oyun</title>
  <link rel="stylesheet" href="stil.css">
</head>
<body>
<main>
  <header><a href="./">Sosyal Oyun</a></header>
  <section id="icerik" class="kart"><p class="soluk">Yükleniyor…</p></section>
  <footer><p>Oyun verisi <a href="https://www.igdb.com" rel="noopener">IGDB.com</a>'dan alınmıştır.</p></footer>
</main>
<script src="ayarlar.js"></script>
<script src="ortak.js"></script>
<script>
  (async () => {
    const kutu = document.getElementById("icerik");
    const ad = new URLSearchParams(location.search).get("ad");
    try {
      const sayfa = ad ? await apiGetir("/paylasim/profil/" + encodeURIComponent(ad)) : null;
      if (!sayfa) return bulunamadi(kutu, "Bu profil bulunamadı.");
      const p = sayfa.profil;
      document.title = p.kullanici.gorunenAd + " (@" + p.kullanici.kullaniciAdi + ") · Sosyal Oyun";
      const sayac = (sayi, ad) => oge("span", {}, oge("strong", { metin: String(sayi) }), document.createTextNode(" " + ad));
      kutu.replaceChildren(
        kisiKarti(p.kullanici),
        p.biyografi ? oge("p", { sinif: "inceleme", metin: p.biyografi }) : null,
        oge("div", { sinif: "sayaclar soluk" },
          sayac(p.takipciSayisi, "takipçi"), sayac(p.takipEdilenSayisi, "takip"), sayac(p.buYilBitirilen, "bu yıl bitirilen")),
        p.vitrin.length ? oge("p", { sinif: "soluk", metin: "Favoriler: " + p.vitrin.map((o) => o.ad).join(", ") }) : null,
        oge("h2", { metin: "Son kayıtlar" }),
        sayfa.sonKayitlar.length
          ? oge("ul", { sinif: "liste" }, ...sayfa.sonKayitlar.map((o) =>
              oge("li", {}, oge("a", { href: "kayit.html?id=" + encodeURIComponent(o.kayit.id) }, oyunVeKayit(o.oyun, o.kayit)))))
          : oge("p", { sinif: "soluk", metin: "Herkese açık kaydı yok." }),
        magazaDugmeleri());
    } catch (e) {
      kutu.replaceChildren(oge("p", { metin: "Şu an yüklenemedi. Biraz sonra tekrar dene." }));
    }
  })();
</script>
</body>
</html>
