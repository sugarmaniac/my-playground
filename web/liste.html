<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste · Sosyal Oyun</title>
  <link rel="stylesheet" href="stil.css">
</head>
<body>
<main>
  <header><a href="./">Sosyal Oyun</a></header>
  <section id="icerik" class="kart"><p class="soluk">Yükleniyor…</p></section>
  <footer><p>Oyun verisi <a href="https://www.igdb.com" rel="noopener">IGDB.com</a>'dan alınmıştır.</p></footer>
</main>
<script src="ayarlar.js"></script>
<script src="ortak.js"></script>
<script>
  (async () => {
    const kutu = document.getElementById("icerik");
    const id = new URLSearchParams(location.search).get("id");
    try {
      // Yalnızca herkese açık listeler döner; Faz 2 kapalıyken listeler hiç açılmaz.
      const liste = id ? await apiGetir("/paylasim/liste/" + encodeURIComponent(id)) : null;
      if (!liste) return bulunamadi(kutu, "Bu liste bulunamadı ya da herkese açık değil.");
      document.title = liste.baslik + " · " + liste.sahip.gorunenAd + " · Sosyal Oyun";
      kutu.replaceChildren(
        oge("h1", { metin: liste.baslik }),
        kisiKarti(liste.sahip),
        liste.aciklama ? oge("p", { sinif: "inceleme", metin: liste.aciklama }) : null,
        oge("p", { sinif: "soluk", metin: liste.oyunlar.length + " oyun · " + liste.begeniSayisi + " beğeni" }),
        oge("ol", { sinif: "liste" }, ...liste.oyunlar.map((o) =>
          oge("li", {}, oge("div", { sinif: "oyun" },
            o.kapakUrl ? oge("img", { sinif: "kapak", src: o.kapakUrl, alt: "" }) : null,
            oge("strong", { metin: o.ad + (o.cikisYili ? " (" + o.cikisYili + ")" : "") }))))),
        magazaDugmeleri());
    } catch (e) {
      kutu.replaceChildren(oge("p", { metin: "Şu an yüklenemedi. Biraz sonra tekrar dene." }));
    }
  })();
</script>
</body>
</html>
